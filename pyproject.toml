[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cslim"
version = "0.1.0"
description = "Context-window optimizer for Claude Code: strips noise from diffs and test output, and maps a codebase from its AST."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ClaudeSlim contributors" }]
keywords = ["claude", "llm", "tokens", "ast", "cli", "context-window", "compression"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Pre-processors",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
tui = ["textual>=0.79"]
# Grammar-backed skeletons for JS/TS/Go. Without it the heuristic scanner is
# used and its output is marked `fallback`.
treesitter = [
  "tree-sitter>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-go>=0.23",
]
exact = ["anthropic>=0.40"]
clipboard = ["pyperclip>=1.9"]
gitignore = ["pathspec>=0.12"]
all = [
  "textual>=0.79", "anthropic>=0.40", "pyperclip>=1.9", "pathspec>=0.12",
  "tree-sitter>=0.23", "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23", "tree-sitter-go>=0.23",
]
# networkx is a test-only dependency: `cslim graph` writes GraphML by hand, and
# the acceptance test reads it back with the library people actually open it
# with. Without it that test skips, and a skipped test verifies nothing.
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5", "networkx>=3.0"]

[project.scripts]
# NB: no `claudeslim` alias — that name is taken on PyPI by an unrelated
# project, and installing the alias would shadow its binary. `cslim` is the
# identity everywhere: distribution, import package and command.
cslim = "cslim.main:main"

[project.urls]
Homepage = "https://github.com/nexusstartup1-create/claudeslim"
Issues = "https://github.com/nexusstartup1-create/claudeslim/issues"

[tool.hatch.build.targets.wheel]
packages = ["cslim"]

[tool.hatch.build.targets.sdist]
# The corpus is real source from node, vue, jquery, vscode, axios, zod, the Go
# standard library, hugo and cobra. It belongs in the repository as test input,
# under SOURCES.md — redistributing it inside our own artifact would pull in
# three other licences and their notice obligations for no benefit. The corpus
# test skips when it is absent, and tests/fetch_corpus.sh restores it.
exclude = [
  "tests/fixtures/corpus/*.js",
  "tests/fixtures/corpus/*.ts",
  "tests/fixtures/corpus/*.go",
  "docs/",
  "cslim-site/",
  "*.rar",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicit set: linting must mean the same thing on every machine, whatever
# global ruff config a contributor happens to have.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # Typer's whole API is `param: T = typer.Option(...)` in the signature.
  "B008",
  # `Optional[List[str]]` is deliberate: Typer resolves annotations at runtime.
  "UP006", "UP007", "UP045",
  "UP035",  # same reason: `typing.List` in Typer signatures
  "E501",   # line length is enforced by the formatter, not the linter
  "SIM108", # a plain if/else often reads better than a nested ternary
  # `×` and `—` are the right glyphs in our strings, comments and docstrings.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# A hook and a compressor must degrade, never crash the caller: the blind
# catches in these modules are the documented design, not an oversight.
"cslim/core/hook.py" = ["BLE001"]
"cslim/core/compressor.py" = ["BLE001"]
"cslim/core/tokenizer.py" = ["BLE001"]
"cslim/core/claude_pipe.py" = ["BLE001"]
"cslim/core/discovery.py" = ["BLE001"]
"cslim/cli.py" = ["BLE001"]
# `BINDINGS` as a class-level list is Textual's documented API.
"cslim/tui/app.py" = ["BLE001", "RUF012"]


[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false

# Optional extras: imported behind try/except, never required to type-check.
[[tool.mypy.overrides]]
module = ["anthropic.*", "tiktoken.*", "pyperclip.*", "pathspec.*",
  "tree_sitter", "tree_sitter.*", "tree_sitter_javascript",
  "tree_sitter_typescript", "tree_sitter_go"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
