name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The floor is what pyproject declares (3.10) and the ceiling is the newest
    # release, because the AST shapes cslim walks change between versions and a
    # skeleton extractor that only works on the developer's interpreter is not
    # a skeleton extractor.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # The clipboard and hook paths have Windows branches; run the suite
          # there too rather than claiming support we never execute.
          - python: "3.12"
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # A venv rather than --system: GitHub's runner interpreter is
      # externally managed and refuses a system install.
      - name: Install
        run: |
          uv venv
          # [tui] too: cslim/tui/app.py is type-checked, so textual must be
          # present or `mypy cslim` passes locally and fails here.
          uv pip install -e ".[dev,tui,treesitter]"
      # The corpus is third-party source, fetched rather than committed. Without
      # this step the corpus tests collect zero cases and vanish silently — the
      # suite would still be green while checking nothing about real files.
      - name: Fetch corpus
        run: bash tests/fetch_corpus.sh
      - name: Tests
        run: uv run pytest -q
      - name: Types
        run: uv run mypy cslim
      - name: Lint
        run: uv run ruff check cslim bench
